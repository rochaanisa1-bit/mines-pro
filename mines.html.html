<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador Mines</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071018;
      color: #00ff88;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
    }

    .controls {
      margin: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button, select {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background: #00aa66;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #00cc77;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 80px);
      gap: 10px;
      margin-bottom: 30px;
    }

    .cell {
      width: 80px;
      height: 80px;
      background: #0d1b24;
      border: 2px solid #00ff88;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .cell:hover {
      transform: scale(1.05);
    }

    .safe {
      background: #123f2c;
    }

    .mine {
      background: #5a1010;
    }

    .stats {
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>💣 Simulador Mines</h1>

  <div class="controls">
    <select id="mineCount">
      <option value="3">3 Minas</option>
      <option value="5">5 Minas</option>
      <option value="7">7 Minas</option>
    </select>

    <button onclick="startGame()">Novo Jogo</button>
    <button onclick="autoPlay()">Modo Auto</button>
  </div>

  <div class="stats">
    <p>Vitórias: <span id="wins">0</span></p>
    <p>Derrotas: <span id="losses">0</span></p>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    let mines = [];
    let revealed = [];
    let wins = 0;
    let losses = 0;

    function startGame() {
      grid.innerHTML = '';
      revealed = [];
      mines = [];

      const mineCount = parseInt(document.getElementById('mineCount').value);

      while (mines.length < mineCount) {
        const random = Math.floor(Math.random() * 25);
        if (!mines.includes(random)) mines.push(random);
      }

      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;

        cell.addEventListener('click', () => revealCell(i, cell));

        grid.appendChild(cell);
      }
    }

    function revealCell(index, cell) {
      if (revealed.includes(index)) return;

      revealed.push(index);

      if (mines.includes(index)) {
        cell.classList.add('mine');
        cell.innerHTML = '💣';
        losses++;
        document.getElementById('losses').textContent = losses;
        alert('Perdeste!');
        revealAll();
      } else {
        cell.classList.add('safe');
        cell.innerHTML = '⭐';

        if (revealed.length === 25 - mines.length) {
          wins++;
          document.getElementById('wins').textContent = wins;
          alert('Vitória!');
        }
      }
    }

    function revealAll() {
      document.querySelectorAll('.cell').forEach((cell, index) => {
        if (mines.includes(index)) {
          cell.classList.add('mine');
          cell.innerHTML = '💣';
        }
      });
    }

    function autoPlay() {
      const cells = document.querySelectorAll('.cell');

      let interval = setInterval(() => {
        const available = [...cells].filter((c, i) => !revealed.includes(i));

        if (available.length === 0) {
          clearInterval(interval);
          return;
        }

        const randomCell = available[Math.floor(Math.random() * available.length)];
        randomCell.click();

        if (randomCell.innerHTML === '💣') {
          clearInterval(interval);
        }
      }, 500);
    }

    startGame();
  </script>
</body>
</html>
